<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>İtalyan Chef Pizza | Dijital Menü</title>
<style>
:root{
  --orange:#e65316;
  --orange2:#ff6a1c;
  --ink:#121212;
  --cream:#f7efe5;
  --paper:#fffaf3;
  --muted:#746c64;
  --line:#ead7c6;
  --green:#0a6a46;
  --shadow:0 10px 28px rgba(28,18,10,.09);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--cream);color:var(--ink);
  font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:86px;
}
.hero{
  background:
    radial-gradient(circle at 85% 0,rgba(230,83,22,.25),transparent 36%),
    linear-gradient(145deg,#0d0d0d,#171717);
  color:white;padding:24px 18px 22px;
}
.brand{max-width:760px;margin:auto}
.kicker{
  font-size:11px;font-weight:900;letter-spacing:.18em;color:#f0a274;
  margin:0 0 8px;text-transform:uppercase
}
h1{
  margin:0;font-family:Georgia,"Times New Roman",serif;
  font-size:clamp(34px,10vw,58px);line-height:.92;letter-spacing:.01em
}
h1 span{color:var(--orange2)}
.tagline{
  margin:10px 0 0;color:#f0a274;font-family:Georgia,serif;font-style:italic;
  font-size:20px
}
.quick{
  max-width:760px;margin:14px auto 0;display:flex;gap:8px;flex-wrap:wrap
}
.quick a{
  color:white;text-decoration:none;font-weight:850;font-size:12px;
  padding:9px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.24)
}
.quick .primary{background:var(--orange);border-color:var(--orange)}
main{max-width:760px;margin:auto;padding:18px 13px 36px}
.intro{margin:4px 2px 15px}
.intro h2{font-family:Georgia,serif;font-size:28px;margin:0 0 5px}
.intro p{margin:0;color:var(--muted);font-size:14px;line-height:1.5}
.category-list{display:grid;gap:10px}
.category{
  background:var(--paper);border:1px solid var(--line);
  border-radius:18px;box-shadow:var(--shadow);overflow:hidden
}
.category-toggle{
  width:100%;border:0;background:transparent;text-align:left;color:var(--ink);
  padding:17px 16px;display:grid;grid-template-columns:42px 1fr auto;
  align-items:center;gap:12px;cursor:pointer
}
.cat-index{
  width:42px;height:42px;border-radius:13px;background:#f8dfd0;color:var(--orange);
  display:grid;place-items:center;font-family:Georgia,serif;font-weight:900;font-size:18px
}
.cat-copy strong{
  display:block;font-family:Georgia,serif;font-size:19px;line-height:1.1
}
.cat-copy small{display:block;color:var(--muted);margin-top:4px;font-size:12px}
.chev{font-size:22px;color:var(--orange);transition:.2s transform}
.category.open .chev{transform:rotate(180deg)}
.category-panel{
  max-height:0;overflow:hidden;transition:max-height .32s ease;
  border-top:0 solid var(--line)
}
.category.open .category-panel{border-top-width:1px}
.panel-inner{padding:13px 13px 15px}
.price-strip{
  display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px
}
.price-chip{
  border:1px solid #efc0a4;background:#fff;border-radius:13px;padding:9px 10px;text-align:center
}
.price-chip small{
  display:block;color:var(--orange);font-size:10px;font-weight:900;text-transform:uppercase
}
.price-chip strong{display:block;font-size:21px;margin-top:2px}
.product-list{display:grid;gap:8px}
.product{
  border:1px solid #ecded2;background:white;border-radius:14px;overflow:hidden
}
.product-toggle{
  border:0;background:white;width:100%;padding:13px 13px;display:flex;
  align-items:center;justify-content:space-between;gap:10px;text-align:left;cursor:pointer
}
.product-toggle strong{font-size:15px}
.product-toggle span{color:var(--orange);font-size:18px;transition:.2s transform}
.product.open .product-toggle span{transform:rotate(45deg)}
.product-detail{display:none;padding:0 13px 13px}
.product.open .product-detail{display:block}
.ingredients{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.photo-slot{
  margin-top:11px;border-radius:13px;overflow:hidden;background:#f3e5d8
}
.photo-slot img{display:block;width:100%;height:auto}
.photo-note{
  margin-top:10px;border:1px dashed #e2c6b0;border-radius:12px;
  padding:10px 11px;color:#9a7864;font-size:11px
}
.campaign-grid{display:grid;gap:9px}
.campaign{
  position:relative;border:1px solid #ecd3c1;background:white;border-radius:14px;padding:13px
}
.campaign small{
  display:inline-block;background:var(--orange);color:white;font-weight:900;
  padding:5px 8px;border-radius:999px;font-size:10px
}
.campaign h3{font-size:16px;margin:9px 82px 0 0;line-height:1.35}
.campaign-price{
  position:absolute;right:11px;bottom:11px;background:#151515;color:#fff;
  border-radius:11px;padding:8px 10px;font-weight:950;font-size:18px
}
.simple-list{display:grid;gap:7px}
.simple-row{
  background:white;border:1px solid #ecded2;border-radius:13px;padding:11px 12px;
  display:flex;justify-content:space-between;gap:12px;align-items:center
}
.simple-row span{font-size:14px}.simple-row strong{white-space:nowrap;color:var(--orange)}
.note{
  margin:17px 2px 0;padding:12px 13px;background:#fff;border:1px solid var(--line);
  border-radius:14px;color:var(--muted);font-size:12px;line-height:1.5
}
.bottom-bar{
  position:fixed;z-index:30;left:0;right:0;bottom:0;background:#111;color:white;
  display:grid;grid-template-columns:repeat(3,1fr);
  padding:9px max(9px,env(safe-area-inset-left)) calc(9px + env(safe-area-inset-bottom));
  border-top:1px solid #333
}
.bottom-bar a{
  color:white;text-decoration:none;text-align:center;font-size:11px;font-weight:850;
  padding:6px 3px
}
.bottom-bar b{display:block;color:var(--orange);font-size:18px;margin-bottom:2px}
@media(min-width:650px){
  .campaign-grid{grid-template-columns:1fr 1fr}
  .product-list{grid-template-columns:1fr 1fr}
  .simple-list{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>

<header class="hero">
  <div class="brand">
    <p class="kicker">Çayırova • Kocaeli</p>
    <h1>İTALYAN <span>CHEF</span> PİZZA</h1>
    <p class="tagline">Lezzetin İtalyan imzası</p>
    <div class="quick">
      <a class="primary" href="tel:05333822104">Alo Paket</a>
      <a target="_blank" rel="noopener"
         href="https://www.google.com/maps/search/?api=1&query=%C3%96zg%C3%BCrl%C3%BCk%20%C4%B0stiklal%20Cd.%20No%3A83%2FC%20%C3%87ay%C4%B1rova%20Kocaeli">
         Yol Tarifi
      </a>
    </div>
  </div>
</header>

<main>
  <section class="intro">
    <h2>Menü</h2>
    <p>Bir kategori seçin. Ürünlere dokunarak içeriklerini görüntüleyebilirsiniz.</p>
  </section>

  <div class="category-list" id="categories"></div>

  <div class="note">
    Fiyatlara KDV dahildir. Ürün içerikleri ve fiyatlar işletme tarafından güncellenebilir.
  </div>
</main>

<nav class="bottom-bar">
  <a href="tel:05333822104"><b>☎</b>ARA</a>
  <a target="_blank" rel="noopener"
     href="https://www.google.com/maps/search/?api=1&query=%C3%96zg%C3%BCrl%C3%BCk%20%C4%B0stiklal%20Cd.%20No%3A83%2FC%20%C3%87ay%C4%B1rova%20Kocaeli"><b>●</b>YOL TARİFİ</a>
  <a href="#siparis"><b>▣</b>SİPARİŞ</a>
</nav>

<script>
const DATA = [
  {
    title:"Kampanya Menüleri", sub:"4 avantajlı menü", type:"campaign",
    items:[
      {label:"MENÜ 1",name:"2 Adet Büyük Boy Ekonomik Pizza + 1 LT Kola",price:"600 TL"},
      {label:"MENÜ 2",name:"2 Adet Orta Boy Ekonomik Pizza + 1 LT Kola",price:"500 TL"},
      {label:"MENÜ 3",name:"1 Adet Orta Boy Ekonomik Pizza + Kutu Kola",price:"280 TL"},
      {label:"MENÜ 4",name:"3 Adet Orta Boy Ekonomik Pizza",price:"650 TL"}
    ]
  },
  {
    title:"Ekonomik Pizzalar", sub:"Orta 230 TL • Büyük 280 TL", type:"pizza",
    prices:["230 TL","280 TL"],
    items:[
      ["Ekonomik Pizza","Pizza sosu, mozzarella, sucuk, mantar, mısır"],
      ["Üç Malzemeli Pizza","Pizza sosu, mozzarella, sucuk, mantar"],
      ["Sucuk Sever Pizza","Pizza sosu, mozzarella, sucuk"],
      ["Margarita Pizza","Pizza sosu, mozzarella"]
    ]
  },
  {
    title:"En Sevilen Pizzalar", sub:"Orta 250 TL • Büyük 310 TL", type:"pizza",
    prices:["250 TL","310 TL"],
    items:[
      ["Sosyetik Pizza","Pizza sosu, mozzarella, sucuk, mantar, mısır, domates, kekik"],
      ["Sevilen Dörtlü Pizza","Pizza sosu, mozzarella, sosis, sucuk, mantar, mısır"],
      ["Sevilen Chef Pizza","Pizza sosu, mozzarella, sucuk, mantar, jambon, zeytin"],
      ["Benim Karışık Pizza","Pizza sosu, mozzarella, sucuk, sosis, mantar, yeşil biber, mısır"],
      ["Chef Pizza","Pizza sosu, mozzarella, sucuk, sosis, zeytin"],
      ["Sosislim Pizza","Pizza sosu, mozzarella, sosis, mısır, mantar, domates"]
    ]
  },
  {
    title:"Bol Malzemeli Pizzalar", sub:"Orta 290 TL • Büyük 340 TL", type:"pizza",
    prices:["290 TL","340 TL"],
    items:[
      ["Karışık Pizza","Pizza sosu, mozzarella, sucuk, sosis, mantar, mısır, domates, zeytin"],
      ["Tavuklu Pizza","Pizza sosu, mozzarella, sosis, tavuk döner, domates"],
      ["Dört Peynirli Pizza","Pizza sosu, mozzarella, kaşar, beyaz peynir, parmesan"],
      ["Sebzeli Pizza","Pizza sosu, mozzarella, soğan, mantar, yeşil biber, mısır, domates"]
    ]
  },
  {
    title:"Chef Süperos Pizzaları", sub:"Orta 330 TL • Büyük 390 TL", type:"pizza",
    prices:["330 TL","390 TL"],
    items:[
      ["Bol Pizza","Pizza sosu, mozzarella, sucuk, sosis, jambon, mantar, yeşil biber, soğan, mısır, domates, kekik, susam"],
      ["Chef Süperos Pizza","Pizza sosu, mozzarella, sucuk, sosis, mantar, mısır, zeytin, köz biber, jalapeno, domates"],
      ["Etlim Pizza","Pizza sosu, mozzarella, et döner, soğan, domates"],
      ["Acılı Chef Pizza","Pizza sosu, mozzarella, küp sucuk, mantar, jalapeno, zeytin, köz biber, kekik"],
      ["İtalyan Chef Pizza","Pizza sosu, mozzarella, küp sucuk, mantar, zeytin, köz biber, kekik"],
      ["Chef Et Dolusu Pizza","Pizza sosu, mozzarella, sucuk, sosis, jambon, pastırma, jalapeno biber"],
      ["Chef Pastırmalı Pizza","Pizza sosu, mozzarella, sucuk, pastırma, mantar, yeşil biber"],
      ["Balıklı Pizza","Pizza sosu, mozzarella, ton balığı, mısır, soğan"],
      ["Turkishim Pizza","Pizza sosu, mozzarella, sucuk, pastırma, mantar, yeşil biber, beyaz peynir"],
      ["Kavurmalı Pizza","Pizza sosu, mozzarella, kavurma, soğan, köz biber, yöresel baharat"]
    ]
  },
  {
    title:"İçecekler", sub:"Kutu ve 1 litre içecekler", type:"simple",
    items:[
      ["Kutu İçecek 330 ml","70 TL"],
      ["1 Litre İçecek","90 TL"]
    ]
  },
  {
    title:"Yan Ürünler", sub:"Patates, sufle ve ekmek çeşitleri", type:"simple",
    items:[
      ["Patates","130 TL"],["Sufle","120 TL"],
      ["Sarımsaklı Ekmek","250 TL"],["Sucuklu Ekmek","300 TL"]
    ]
  },
  {
    title:"Ekstra Malzemeler / Kenar", sub:"Ekstra malzeme ve kenar seçenekleri", type:"simple",
    items:[
      ["Mozzarella","150 TL"],["Sucuk","100 TL"],["Sosis","100 TL"],["Jambon","100 TL"],
      ["Tavuk Döner","100 TL"],["Pastırma","170 TL"],["Et Döner","120 TL"],["Kavurma","200 TL"],
      ["Sebze Ürünleri","90 TL"],["Bol Peynir Kenar Orta","100 TL"],["Simit Kenar Orta","100 TL"],
      ["Bol Peynir Kenar Büyük","130 TL"],["Simit Kenar Büyük","130 TL"],
      ["Sarımsak Kenar Orta","100 TL"],["Sarımsak Kenar Büyük","120 TL"]
    ]
  }
];

// Daha sonra fotoğraf eklemek için:
// ürün dizisini ["Ürün Adı","İçerik","assets/fotograf.webp"] biçiminde yap.
// Ürüne dokunulduğunda fotoğraf otomatik olarak içeriğin altında açılır.

const root = document.getElementById("categories");

function productHTML(item){
  const [name, ingredients, image] = item;
  return `
    <div class="product">
      <button class="product-toggle" type="button">
        <strong>${name}</strong><span>＋</span>
      </button>
      <div class="product-detail">
        <p class="ingredients">${ingredients}</p>
        ${image ? `<div class="photo-slot"><img src="${image}" alt="${name}" loading="lazy"></div>` : ""}
      </div>
    </div>`;
}

DATA.forEach((cat,i)=>{
  const section = document.createElement("section");
  section.className="category";
  let body = "";

  if(cat.type==="campaign"){
    body = `<div class="campaign-grid">` + cat.items.map(x=>`
      <article class="campaign">
        <small>${x.label}</small>
        <h3>${x.name}</h3>
        <div class="campaign-price">${x.price}</div>
      </article>`).join("") + `</div>`;
  } else if(cat.type==="pizza"){
    body = `
      <div class="price-strip">
        <div class="price-chip"><small>Orta Boy</small><strong>${cat.prices[0]}</strong></div>
        <div class="price-chip"><small>Büyük Boy</small><strong>${cat.prices[1]}</strong></div>
      </div>
      <div class="product-list">${cat.items.map(productHTML).join("")}</div>`;
  } else {
    body = `<div class="simple-list">` + cat.items.map(x=>`
      <div class="simple-row"><span>${x[0]}</span><strong>${x[1]}</strong></div>`).join("") + `</div>`;
  }

  section.innerHTML = `
    <button class="category-toggle" type="button">
      <span class="cat-index">${String(i+1).padStart(2,"0")}</span>
      <span class="cat-copy"><strong>${cat.title}</strong><small>${cat.sub}</small></span>
      <span class="chev">⌄</span>
    </button>
    <div class="category-panel"><div class="panel-inner">${body}</div></div>`;
  root.appendChild(section);
});

document.querySelectorAll(".category-toggle").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const cat = btn.closest(".category");
    const wasOpen = cat.classList.contains("open");

    document.querySelectorAll(".category.open").forEach(open=>{
      if(open!==cat){
        open.classList.remove("open");
        open.querySelector(".category-panel").style.maxHeight=null;
      }
    });

    cat.classList.toggle("open",!wasOpen);
    const panel = cat.querySelector(".category-panel");
    panel.style.maxHeight = !wasOpen ? panel.scrollHeight+"px" : null;

    if(!wasOpen){
      setTimeout(()=>cat.scrollIntoView({behavior:"smooth",block:"start"}),120);
    }
  });
});

document.addEventListener("click",e=>{
  const btn=e.target.closest(".product-toggle");
  if(!btn) return;
  const product=btn.closest(".product");
  product.classList.toggle("open");
  const panel=product.closest(".category-panel");
  if(panel && product.closest(".category").classList.contains("open")){
    panel.style.maxHeight=panel.scrollHeight+"px";
  }
});
</script>
</body>
</html>
